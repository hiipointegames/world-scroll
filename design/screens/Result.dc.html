<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Scroll — Result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1026; color: #F4F1E8; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 56px 20px 0 20px">
    <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.5px">World<span style="color: #FFB547">Scroll</span></div>
    <div style="display: inline-flex; align-items: center; background: #3DDCC4; color: #0B1026; border-radius: 999px; padding: 6px 14px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 1.5px">RIVERS</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 24px 0 24px; text-align: center">
    <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 44px; color: #FFB547; line-height: 1">So close!</div>
    <div style="font-size: 16px; color: #B9BEDA">You were 312 km from the Amazon River</div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
    <svg width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Globe showing your tap and the correct location of the Amazon River">
      <circle cx="160" cy="160" r="150" fill="#1A3A7A"></circle>
      <g fill="none" stroke="#F4F1E8" stroke-opacity="0.12" stroke-width="1.2">
        <ellipse cx="160" cy="160" rx="150" ry="50"></ellipse>
        <ellipse cx="160" cy="160" rx="150" ry="100"></ellipse>
        <ellipse cx="160" cy="160" rx="50" ry="150"></ellipse>
        <ellipse cx="160" cy="160" rx="100" ry="150"></ellipse>
      </g>
      <path d="M60 120c30-40 110-40 150 -10 40 30 40 110 0 150-40 40-120 40-150 0-30-40-30-100 0-140z" fill="#3DDCC4" fill-opacity="0.85"></path>
      <path d="M92 168c18-4 34 8 52 4 18-4 30-14 48-10 14 3 24 12 36 12" fill="none" stroke="#5BA8FF" stroke-width="7" stroke-linecap="round"></path>
      <path d="M92 168c18-4 34 8 52 4 18-4 30-14 48-10 14 3 24 12 36 12" fill="none" stroke="#0B1026" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"></path>
      <line x1="150" y1="210" x2="160" y2="170" stroke="#FFB547" stroke-width="2" stroke-dasharray="5 5"></line>
      <circle cx="150" cy="212" r="9" fill="#FFB547"></circle>
      <circle cx="150" cy="212" r="3.5" fill="#0B1026"></circle>
      <circle cx="160" cy="170" r="11" fill="none" stroke="#F4F1E8" stroke-width="3"></circle>
      <circle cx="160" cy="170" r="4" fill="#F4F1E8"></circle>
      <circle cx="160" cy="160" r="150" fill="none" stroke="#F4F1E8" stroke-opacity="0.25" stroke-width="2"></circle>
    </svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 20px">
    <div style="background: #151C42; border-radius: 16px; padding: 14px 10px; text-align: center">
      <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 24px; color: #3DDCC4">+860</div>
      <div style="font-size: 12px; color: #B9BEDA">points</div>
    </div>
    <div style="background: #151C42; border-radius: 16px; padding: 14px 10px; text-align: center">
      <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 24px">8</div>
      <div style="font-size: 12px; color: #B9BEDA">day streak</div>
    </div>
    <div style="background: #151C42; border-radius: 16px; padding: 14px 10px; text-align: center">
      <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 24px">2.4s</div>
      <div style="font-size: 12px; color: #B9BEDA">tap speed</div>
    </div>
  </div>

  <div style="margin: 14px 20px 0 20px; background: #151C42; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"></path></svg>
    <div style="font-size: 14px; line-height: 1.45; color: #E2E4F0"><span style="font-weight: 600; color: #F4F1E8">Fun fact:</span> the Amazon carries more water than the next seven largest rivers combined.</div>
  </div>

  <div style="display: flex; gap: 12px; padding: 18px 20px 40px 20px">
    <button aria-label="Share result" style="width: 56px; height: 56px; border-radius: 18px; border: 2px solid #2A3570; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F1E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"></path></svg>
    </button>
    <button style="flex-grow: 1; height: 56px; border-radius: 18px; border: none; background: #FFB547; color: #0B1026; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">Swipe up for the next one</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
