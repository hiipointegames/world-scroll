<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Scroll — The Scroll</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1026; color: #F4F1E8; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 56px 20px 0 20px">
    <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.5px">World<span style="color: #FFB547">Scroll</span></div>
    <div style="display: flex; gap: 8px">
      <div style="display: flex; align-items: center; gap: 6px; background: #1A2350; border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 3"></path></svg>
        <span>{{streak}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #1A2350; border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3DDCC4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>
        <span>{{points}}</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 24px 0 24px; text-align: center">
    <div style="display: inline-flex; align-items: center; gap: 8px; background: {{card.chipBg}}; color: #0B1026; border-radius: 999px; padding: 6px 14px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 1.5px">{{card.cat}}</div>
    <div style="font-size: 15px; color: #B9BEDA">Where is…</div>
    <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 38px; line-height: 1.05">{{card.q}}</div>
    <div style="font-size: 13px; color: #8E95BD">Scroll #{{num}} · tap the globe</div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative">
    <svg width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Spinning globe — tap where you think it is">
      <circle cx="160" cy="160" r="150" fill="#1A3A7A"></circle>
      <g fill="none" stroke="#F4F1E8" stroke-opacity="0.12" stroke-width="1.2">
        <ellipse cx="160" cy="160" rx="150" ry="50"></ellipse>
        <ellipse cx="160" cy="160" rx="150" ry="100"></ellipse>
        <line x1="10" y1="160" x2="310" y2="160"></line>
        <ellipse cx="160" cy="160" rx="50" ry="150"></ellipse>
        <ellipse cx="160" cy="160" rx="100" ry="150"></ellipse>
        <line x1="160" y1="10" x2="160" y2="310"></line>
      </g>
      <g fill="#3DDCC4" fill-opacity="0.85">
        <path d="M70 70c20-14 52-12 66 4 10 12 2 26 10 38 8 13-6 24-20 22-12-2-16 10-28 8-18-3-34-20-38-38-3-14 0-26 10-34z"></path>
        <path d="M118 168c14-6 30 0 36 14 6 14 0 24 4 40 4 18-6 40-20 46-12 5-18-10-20-26-2-14-12-20-14-36-2-16 2-32 14-38z"></path>
        <path d="M186 80c16-10 44-8 62 4 16 10 30 26 26 44-3 14-20 14-30 22-10 8-6 22-20 26-16 4-26-10-30-24-4-12-16-16-18-30-2-16 0-34 10-42z"></path>
        <path d="M206 186c12-4 24 4 26 16 2 14-8 22-6 36 1 10-10 18-20 14-12-4-14-18-16-30-2-14 4-32 16-36z"></path>
        <path d="M236 236c10-2 22 2 24 10 2 8-8 14-18 14-10 0-16-6-14-14 1-6 4-9 8-10z"></path>
      </g>
      <circle cx="160" cy="160" r="150" fill="none" stroke="#F4F1E8" stroke-opacity="0.25" stroke-width="2"></circle>
      <g>
        <circle cx="{{card.px}}" cy="{{card.py}}" r="22" fill="#FFB547" fill-opacity="0.18"></circle>
        <circle cx="{{card.px}}" cy="{{card.py}}" r="12" fill="none" stroke="#FFB547" stroke-width="2" stroke-dasharray="4 4"></circle>
        <circle cx="{{card.px}}" cy="{{card.py}}" r="4" fill="#FFB547"></circle>
      </g>
    </svg>
    <div style="position: absolute; right: 18px; top: 40%; display: flex; flex-direction: column; gap: 18px; align-items: center">
      <button aria-label="Zoom in" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1A2350; color: #F4F1E8; font-size: 22px; font-family: Inter, sans-serif; cursor: pointer">+</button>
      <button aria-label="Zoom out" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1A2350; color: #F4F1E8; font-size: 22px; font-family: Inter, sans-serif; cursor: pointer">−</button>
    </div>
  </div>

  <div style="display: flex; gap: 12px; padding: 0 20px">
    <button onClick="{{next}}" style="flex-grow: 1; height: 56px; border-radius: 18px; border: 2px solid #2A3570; background: transparent; color: #F4F1E8; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 17px; cursor: pointer">Skip</button>
    <button onClick="{{next}}" style="flex-grow: 2; height: 56px; border-radius: 18px; border: none; background: #FFB547; color: #0B1026; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">Lock in my tap</button>
  </div>

  <button onClick="{{next}}" style="margin: 18px 20px 28px 20px; height: 84px; border: none; border-radius: 22px 22px 0 0; background: #151C42; color: #F4F1E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-family: Inter, sans-serif">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E95BD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
    <span style="font-size: 12px; color: #8E95BD; letter-spacing: 1.2px">SWIPE UP · NEXT</span>
    <span style="font-family: Fredoka, sans-serif; font-size: 16px; font-weight: 600">{{peek.cat}} — {{peek.q}}</span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    var cards = [
      { cat: 'RIVERS', q: 'The Amazon River', chipBg: '#3DDCC4', px: 140, py: 200 },
      { cat: 'COUNTRIES', q: 'Uganda', chipBg: '#FFB547', px: 214, py: 196 },
      { cat: 'DESERTS', q: 'The Gobi Desert', chipBg: '#F7C873', px: 236, py: 110 },
      { cat: 'CAPITALS', q: 'Canberra', chipBg: '#FF8F6B', px: 250, py: 250 },
      { cat: 'MOUNTAINS', q: 'Mount Kilimanjaro', chipBg: '#A9C6FF', px: 220, py: 208 },
      { cat: 'CITIES', q: 'Rio de Janeiro', chipBg: '#9BE7A8', px: 150, py: 228 }
    ];
    var i = this.state.i;
    var self = this;
    return {
      card: cards[i % cards.length],
      peek: cards[(i + 1) % cards.length],
      num: 12 + i,
      streak: 7 + i,
      points: (4820 + i * 640).toLocaleString('en-US'),
      next: function () { self.setState({ i: i + 1 }); }
    };
  }
}
</script>
</body>
</html>
