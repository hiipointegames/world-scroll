<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Scroll — Sports Leagues</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1026; color: #F4F1E8; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 56px 20px 0 20px">
    <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.5px">World<span style="color: #FFB547">Scroll</span></div>
    <div style="display: inline-flex; align-items: center; gap: 6px; background: #FF6FA8; color: #0B1026; border-radius: 999px; padding: 6px 14px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 1.5px">SPORTS</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 16px 20px 0 20px">
    <sc-for list="{{regions}}" as="rg" hint-placeholder-count="3">
      <button onClick="{{rg.pick}}" aria-pressed="{{rg.pressed}}" style="height: 48px; border-radius: 14px; border: 2px solid {{rg.border}}; background: {{rg.bg}}; color: {{rg.fg}}; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">{{rg.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 20px 0 20px">
    <sc-for list="{{sports}}" as="sp" hint-placeholder-count="3">
      <button onClick="{{sp.pick}}" aria-pressed="{{sp.pressed}}" style="flex-grow: 1; height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid {{sp.border}}; background: {{sp.bg}}; color: {{sp.fg}}; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">{{sp.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 24px 0 24px; text-align: center">
    <div style="font-size: 13px; color: #B9BEDA; letter-spacing: 1.2px">{{sport.full}} · CARD {{num}} OF 3</div>
    <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 27px; line-height: 1.1">Where do {{card.team}} play?</div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px">
    <div style="width: 358px; height: 254px; border-radius: 22px; background: #0F1A40; border: 2px solid #1E2A5C; overflow: hidden; display: flex; align-items: center; justify-content: center">
      <svg onClick="{{tap}}" width="354" height="250" viewBox="0 0 340 240" role="img" aria-label="Map of the region. Tap where you think the team plays." style="cursor: crosshair; display: block">
        <rect x="0" y="0" width="340" height="240" fill="#0F1A40"></rect>
        <path d="{{map.other}}" fill="#1D2B5E"></path>
        <path d="{{map.land}}" fill="#2E6F8E"></path>
        <path d="{{map.inner}}" fill="none" stroke="#F4F1E8" stroke-opacity="0.18" stroke-width="0.6"></path>
        <path d="{{map.borders}}" fill="none" stroke="#F4F1E8" stroke-opacity="0.28" stroke-width="0.7"></path>
        <line x1="{{g.x}}" y1="{{g.y}}" x2="{{a.x}}" y2="{{a.y}}" stroke="#FFB547" stroke-width="2" stroke-dasharray="5 4" stroke-opacity="{{answerOp}}"></line>
        <circle cx="{{a.x}}" cy="{{a.y}}" r="9" fill="none" stroke="#3DDCC4" stroke-width="3" stroke-opacity="{{answerOp}}"></circle>
        <circle cx="{{a.x}}" cy="{{a.y}}" r="3.5" fill="#3DDCC4" fill-opacity="{{answerOp}}"></circle>
        <circle cx="{{g.x}}" cy="{{g.y}}" r="8" fill="#FFB547" fill-opacity="{{guessOp}}" stroke="#0B1026" stroke-width="2" stroke-opacity="{{guessOp}}"></circle>
        <circle cx="{{g.x}}" cy="{{g.y}}" r="3" fill="#0B1026" fill-opacity="{{guessOp}}"></circle>
      </svg>
    </div>
  </div>

  <div style="margin: 0 20px; min-height: 104px; background: #151C42; border-radius: 16px; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
    <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 20px; color: #FFB547">{{milesLine}}</div>
        <div style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px; color: #3DDCC4">+{{pts}} pts</div>
      </div>
      <div style="font-size: 14px; font-weight: 600; color: #F4F1E8">{{card.city}}</div>
      <div style="font-size: 13px; line-height: 1.45; color: #E2E4F0">{{card.fact}}</div>
    </sc-if>
    <sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
      <div style="font-size: 12px; color: #B9BEDA; letter-spacing: 1.2px">{{hintTitle}}</div>
      <div style="font-size: 14px; line-height: 1.45; color: #E2E4F0">{{hintBody}}</div>
    </sc-if>
  </div>

  <div style="display: flex; gap: 12px; padding: 14px 20px 34px 20px">
    <button onClick="{{next}}" style="flex-grow: 1; height: 56px; border-radius: 18px; border: 2px solid #2A3570; background: transparent; color: #F4F1E8; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 17px; cursor: pointer">Skip</button>
    <button onClick="{{primary}}" style="flex-grow: 2; height: 56px; border-radius: 18px; border: none; background: {{primaryBg}}; color: {{primaryFg}}; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">{{primaryLabel}}</button>
  </div>
</div>
</x-dc>

    var milesLine = mi <= 25 ? 'Bullseye! ' + mi + ' mi off' : mi.toLocaleString('en-US') + ' miles off';
    var reset = { i: 0, guess: null, revealed: false };
    var next = function () { self.setState({ i: self.state.i + 1, guess: null, revealed: false }); };
    var tap = function (e) {
      if (self.state.revealed) return;
      var el = e.currentTarget, r = el.getBoundingClientRect();
      var x = (e.clientX - r.left) * 340 / r.width, y = (e.clientY - r.top) * 240 / r.height;
      self.setState({ guess: toLL(x, y) });
    };
    function chip(on, onColor) {
      return { bg: on ? onColor : '#151C42', fg: on ? '#0B1026' : '#F4F1E8', border: on ? onColor : '#232C60', pressed: on ? 'true' : 'false' };
    }
    var hasGuess = !!s.guess;
    return {
      regions: regions.map(function (r, n) {
        var o = chip(n === s.region, '#FF6FA8');
        o.label = r.label;
        o.pick = function () { self.setState(Object.assign({ region: n, sport: 0 }, reset)); };
        return o;
      }),
      sports: R.sports.map(function (sp, n) {
        var o = chip(n === s.sport, '#3DDCC4');
        o.label = sp.label;
        o.pick = function () { self.setState(Object.assign({ sport: n }, reset)); };
        return o;
      }),
      map: M, sport: S, card: card, num: idx + 1,
      a: a, g: g,
      guessOp: hasGuess ? 1 : 0,
      answerOp: s.revealed ? 1 : 0,
      revealed: s.revealed, waiting: !s.revealed,
      hintTitle: hasGuess ? 'GUESS PLACED' : 'YOUR MOVE',
      hintBody: hasGuess ? 'Happy with it? Lock it in, or tap somewhere else to move your pin.' : 'Tap anywhere on the map where you think they play their home games.',
      milesLine: milesLine, pts: pts,
      tap: tap, next: next,
      primary: s.revealed ? next : function () { if (self.state.guess) self.setState({ revealed: true }); },
      primaryLabel: s.revealed ? 'Swipe up · next team' : (hasGuess ? 'Lock in my guess' : 'Tap the map first'),
      primaryBg: (s.revealed || hasGuess) ? '#FFB547' : '#2A3570',
      primaryFg: (s.revealed || hasGuess) ? '#0B1026' : '#B9BEDA'
    };
  }
}
</script>
