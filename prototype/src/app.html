<title>World Scroll</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-sized column. Each screen stacks top bar → content → actions; on a card the map takes the leftover height.
   Single dark look on purpose (it is the brand), so there is no light theme. Tokens come from CLAUDE.md. */
:root {
  --backdrop: #060917;
  --ink: #0B1026; --surface: #151C42; --raised: #1A2350; --outline: #232C60; --outline-2: #2A3570; --map-edge: #1E2A5C;
  --text: #F4F1E8; --muted: #B9BEDA; --dim: #8E95BD; --body-strong: #E2E4F0;
  --gold: #FFB547; --teal: #3DDCC4; --pink: #FF6FA8;
  --font-display: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }
body {
  margin: 0;
  background: var(--backdrop); color: var(--text); font-family: var(--font-body);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.phone { position: relative; width: 100%; height: 100%; max-width: 440px; background: var(--ink); overflow: hidden; }
@media (min-width: 600px) and (min-height: 640px) {
  .phone { width: 390px; height: min(844px, calc(100% - 40px)); border-radius: 44px;
    box-shadow: 0 0 0 10px #161B36, 0 0 0 11px #262D55, 0 40px 90px rgba(0, 0, 0, .65); }
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 20px 20px 0; flex-shrink: 0; }
.topbar-left { display: flex; align-items: center; gap: 6px; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .5px; }
.wordmark span { color: var(--gold); }
.wordmark { display: inline-flex; align-items: center; }
.wm-globe { width: .95em; height: .95em; margin-right: .22em; flex-shrink: 0; }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 0; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
.brand .wordmark { line-height: 1.05; }
.tagline { font-size: 10.5px; font-weight: 500; color: var(--muted); letter-spacing: .3px; white-space: nowrap; }

/* Welcome screen */
.screen.intro { background: radial-gradient(ellipse 90% 50% at 50% 0%, rgba(46, 111, 142, .35), transparent 70%), var(--ink); }
.intro-map { width: 100%; height: auto; display: block; margin-top: 18px; flex-shrink: 0; }
.intro-dot { fill: var(--gold); transform-box: fill-box; transform-origin: center; opacity: 0; animation: blip 2.7s ease-out infinite; }
@keyframes blip { 0% { opacity: 0; transform: scale(.3); } 12% { opacity: 1; transform: scale(1.3); } 22% { transform: scale(1); } 60% { opacity: 1; } 100% { opacity: 0; } }
.intro-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 8px 24px 26px; }
.intro-brand { display: flex; flex-direction: column; gap: 8px; }
.wordmark.big { font-size: 26px; }
.intro-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1.02; text-wrap: balance; }
.intro-sub { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.intro-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.intro-steps li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: var(--body-strong); }
.intro-steps b { color: var(--text); }
.step-n { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--raised); color: var(--gold);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.intro-foot { flex-shrink: 0; padding: 12px 24px 24px; background: linear-gradient(to top, var(--ink) 70%, transparent); margin-top: -20px; position: relative; }
.intro-foot .btn.big { animation: nudge 2.6s ease-in-out 1.5s infinite; }
@keyframes nudge { 0%, 88%, 100% { transform: translateY(0); } 92% { transform: translateY(-4px); } 96% { transform: translateY(1px); } }
@media (max-height: 720px) {
  .intro-map { max-height: 140px; margin-top: 8px; }
  .intro-title { font-size: 31px; }
  .intro-body { gap: 12px; }
  .intro-sub { font-size: 14px; }
  .intro-steps li { font-size: 13.5px; }
}
.stats { display: flex; gap: 8px; }
.stat { display: flex; align-items: center; gap: 6px; background: var(--raised); border: none; border-radius: 999px; padding: 0 12px; height: 36px;
  font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; transition: background .15s; }
.stat:hover { background: #24306A; }
/* Chips look compact but get a full 44px tap area */
.stat, .brand { position: relative; }
.stat::after, .brand::after { content: ""; position: absolute; inset: -4px -2px; }
.stat:active { transform: scale(.94); }
.stats { align-items: center; }
.sound-btn { margin-left: 0; width: 40px; height: 40px; }
.sound-btn[aria-pressed="false"] { color: var(--dim); }
.stat.bump { animation: bump .45s ease-out; }
@keyframes bump { 40% { transform: scale(1.14); background: #24306A; } }
.icon-btn { width: 44px; height: 44px; margin-left: -10px; border-radius: 22px; border: none; background: transparent;
  color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { color: var(--text); background: var(--raised); }

/* Buttons */
.btn { height: 56px; border-radius: 18px; font-family: var(--font-display); font-weight: 700; font-size: 17px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .1s, filter .15s; }
.btn:active { transform: scale(.98); }
.btn.primary { border: none; background: var(--gold); color: var(--ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.primary:disabled { background: var(--outline-2); color: var(--muted); cursor: not-allowed; }
.btn.ghost { border: 2px solid var(--outline-2); background: transparent; color: var(--text); font-weight: 600; }
.btn.teal { height: 46px; padding: 0 18px; border: none; border-radius: 14px; background: var(--teal); color: var(--ink); font-size: 15px; }
.btn.big { height: 62px; border-radius: 20px; font-size: 18px; width: 100%; flex-shrink: 0; }

/* Pick your feed */
.picker-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 20px; }
.picker-head h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 29px; line-height: 1.06; text-wrap: balance; }
.sports-hero { position: relative; flex-shrink: 0; border: none; border-radius: 22px; padding: 16px 16px 16px 18px; cursor: pointer; overflow: hidden;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; color: var(--ink);
  background: radial-gradient(circle at 85% -20%, rgba(255, 255, 255, .45), transparent 45%), linear-gradient(120deg, #FF6FA8 0%, #FF8F6B 60%, #FFB547 100%);
  box-shadow: 0 10px 30px rgba(255, 111, 168, .28); transition: transform .12s; }
.sports-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .35) 45%, transparent 60%);
  transform: translateX(-100%); animation: shine 4.5s ease-in-out 1s infinite; pointer-events: none; }
@keyframes shine { 0%, 70% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.sports-hero:active { transform: scale(.98); }
.hero-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.hero-kicker { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; opacity: .75; }
.hero-name { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; }
.hero-sub { font-size: 12px; font-weight: 500; opacity: .8; }
.hero-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.hero-trophies { display: flex; gap: 6px; background: rgba(11, 16, 38, .82); border-radius: 999px; padding: 5px 9px; color: var(--text); }
.hero-go { background: var(--ink); color: var(--text); font-family: var(--font-display); font-weight: 700; font-size: 15px; border-radius: 12px; padding: 8px 16px; }
.picker-head p { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { height: 76px; border-radius: 20px; border: 2px solid var(--outline); background: var(--surface); cursor: pointer;
  display: flex; flex-direction: column; justify-content: space-between; padding: 13px 15px; text-align: left; transition: border-color .15s, transform .1s; }
.tile { transition: border-color .15s, transform .12s, box-shadow .2s; }
.tile .dot { transition: transform .2s; }
.tile:hover { border-color: color-mix(in srgb, var(--c, var(--outline-2)) 55%, var(--outline)); transform: translateY(-2px); }
.tile:hover .dot { transform: scale(1.25); }
.tile:active { transform: scale(.97); border-color: var(--c, var(--outline-2)); box-shadow: 0 0 22px color-mix(in srgb, var(--c, transparent) 40%, transparent); }
.tile.wide { grid-column: span 2; height: 84px; }
.tile-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.dot { width: 14px; height: 14px; border-radius: 7px; flex-shrink: 0; }
.tile-count { font-size: 11px; color: var(--dim); letter-spacing: .4px; }
.tile-text { display: flex; flex-direction: column; gap: 2px; }
.tile-name { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.tile-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-text { min-width: 0; width: 100%; }
.daily { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-shrink: 0; }
.daily-label { font-size: 12px; color: var(--muted); letter-spacing: 1.2px; }
.daily-title { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin-top: 2px; }
.reset { align-self: center; background: none; border: none; color: var(--dim); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 10px; min-height: 44px; }

/* Sports tabs */
.region-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px 20px 0; flex-shrink: 0; }
.tab { height: 44px; border-radius: 14px; border: 2px solid var(--outline); background: var(--surface); color: var(--text);
  font-family: var(--font-display); font-weight: 700; font-size: 15px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: var(--ink); }
.sport-tabs { display: flex; gap: 6px; padding: 10px 20px 0; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
.sport-tabs::-webkit-scrollbar { display: none; }
.pill { flex: 1 0 auto; min-width: 52px; height: 44px; padding: 0 9px; border-radius: 999px; border: 2px solid var(--outline); background: var(--surface);
  color: var(--text); font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--ink); }

/* Sports feed: stadium-light glow, hot-streak meter, trophy case */
.screen.sports { background:
  radial-gradient(ellipse 70% 40% at 10% -8%, rgba(255, 111, 168, .26), transparent 70%),
  radial-gradient(ellipse 60% 35% at 95% -6%, rgba(61, 220, 196, .18), transparent 70%), var(--ink); }
.screen.sports .card { background: transparent; padding-bottom: 14px; }
.screen.sports .peek { display: none; } /* the meter takes this space; swipe and "Next card" still work */
.screen.sports .panel { min-height: 108px; }
.screen.sports .prompt.long { font-size: 24px; }
.screen.sports .chip { box-shadow: 0 0 18px rgba(255, 111, 168, .45); }
.meter-row { display: flex; align-items: center; gap: 8px; padding: 10px 20px 0; flex-shrink: 0; }
.meter { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.meter-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.1px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter-label .fire { color: var(--gold); text-shadow: 0 0 10px rgba(255, 181, 71, .7); }
.pips { display: flex; gap: 4px; }
.pip { flex: 1; height: 8px; border-radius: 4px; background: var(--outline); transition: background .25s, box-shadow .25s; }
.pip.mile { height: 12px; margin-top: -2px; }
.pip.mile-bronze { box-shadow: inset 0 0 0 2px #E39A5D; }
.pip.mile-silver { box-shadow: inset 0 0 0 2px #CBD5E8; }
.pip.mile-gold { box-shadow: inset 0 0 0 2px #FFC93C; }
.pip.on.bronze { background: #E39A5D; }
.pip.on.silver { background: #CBD5E8; }
.pip.on.gold { background: #FFC93C; box-shadow: 0 0 10px rgba(255, 201, 60, .7); }
.trophy-case { display: flex; gap: 6px; align-items: center; height: 40px; padding: 0 10px; border-radius: 999px; border: 2px solid var(--outline);
  background: var(--surface); cursor: pointer; flex-shrink: 0; }
.trophy-case:hover { border-color: var(--outline-2); }
.tc-item { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tc-item.empty { opacity: .45; }
.res-verdict.sport { font-size: 26px; letter-spacing: .3px; text-shadow: 0 0 16px rgba(61, 220, 196, .45); }
.venue { color: var(--muted); font-weight: 500; }

/* Daily Sports 10 */
.sd-wrap { padding: 12px 20px 0; flex-shrink: 0; }
.daily-sports { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; border-radius: 16px; cursor: pointer;
  border: 2px solid color-mix(in srgb, #FFC93C 55%, transparent); text-align: left; color: var(--text);
  background: linear-gradient(100deg, rgba(255, 201, 60, .2), rgba(255, 111, 168, .16)); transition: transform .12s, border-color .15s; }
.daily-sports:hover { border-color: #FFC93C; }
.daily-sports:active { transform: scale(.98); }
.sd-icon { width: 34px; height: 34px; border-radius: 50%; background: rgba(11, 16, 38, .6); display: grid; place-items: center; flex-shrink: 0; }
.sd-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sd-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.3px; color: #FFC93C; }
.sd-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sd-go { flex-shrink: 0; background: #FFC93C; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 14px; border-radius: 11px; padding: 8px 14px; }
.dsqs { display: flex; gap: 5px; }
.dsq { flex: 1; height: 12px; border-radius: 4px; background: var(--outline); transition: background .25s, transform .25s; }
.dsq.now { box-shadow: inset 0 0 0 2px var(--gold); }
.dsq.hit { background: var(--teal); }
.dsq.miss { background: #E25C6B; }
.sd-hits { color: var(--teal); }
.sd-score { font-family: var(--font-display); font-weight: 700; line-height: 1; margin-top: 8px; }
.sd-score b { font-size: 84px; color: #FFC93C; text-shadow: 0 0 30px rgba(255, 201, 60, .35); }
.sd-score span { font-size: 34px; color: var(--muted); }
.sd-verdict { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin-top: 4px; }
.sd-grid { display: flex; gap: 6px; justify-content: center; }
.dsq.big { flex: 0 0 26px; height: 26px; border-radius: 7px; animation: sq-in .35s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes sq-in { from { transform: scale(0); } }
.share-card { background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.share-label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; color: var(--muted); }
.share-text { margin: 0; font-family: var(--font-body); font-size: 13px; line-height: 1.5; white-space: pre-wrap; background: var(--raised);
  border-radius: 12px; padding: 10px 12px; color: var(--body-strong); user-select: all; -webkit-user-select: all; }
.share-card .btn.big { height: 54px; }
.btn.primary.done { background: var(--teal); }
.share-note { font-size: 13px; color: var(--teal); text-align: center; min-height: 18px; }
.btn.ghost.big { width: 100%; }
.row-mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; color: var(--ink); }
.row-mark.hit { background: var(--teal); }
.row-mark.miss { background: #E25C6B; }
.sd-list .row-name { display: flex; flex-direction: column; }
.sd-list .row-name small { font-size: 11px; color: var(--dim); }

/* Pop-up sheets */
.sheet-overlay { position: absolute; inset: 0; z-index: 50; background: rgba(6, 9, 23, .72); display: flex; align-items: flex-end;
  animation: fade .2s ease-out; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
@keyframes fade { from { opacity: 0; } }
.sheet { position: relative; z-index: 2; width: 100%; box-sizing: border-box; background: var(--surface); border-radius: 26px 26px 0 0; padding: 26px 22px 26px;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; border-top: 2px solid var(--outline-2);
  animation: slideup .32s cubic-bezier(.2, .9, .3, 1.1); max-height: 92%; overflow-y: auto; }
@keyframes slideup { from { transform: translateY(100%); } }
.sheet .btn.big { margin-top: 10px; }
.sheet-icon { width: 76px; height: 76px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; margin-bottom: 4px; }
.sheet-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.6px; color: var(--muted); }
.sheet-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.08; text-wrap: balance; }
.sheet-title.award { font-size: 36px; }
.sheet-text { margin: 4px 0 0; font-size: 15px; line-height: 1.5; color: var(--body-strong); max-width: 34ch; }
.sheet-text.small { font-size: 13px; color: var(--muted); }
.sheet-text b { color: var(--text); }
.sheet-status { margin-top: 8px; background: var(--raised); border-radius: 14px; padding: 10px 14px; font-size: 13.5px; font-weight: 600; color: var(--gold); }
.points-table { width: 100%; display: flex; flex-direction: column; background: var(--raised); border-radius: 14px; padding: 4px 0; margin-top: 6px; }
.points-table div { display: flex; justify-content: space-between; padding: 7px 14px; font-size: 14px; }
.points-table div + div { border-top: 1px solid var(--outline); }
.points-table b { color: var(--teal); font-variant-numeric: tabular-nums; }
.tc-big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; margin: 6px 0 2px; }
.tc-big .tc-item { flex-direction: column; gap: 4px; background: var(--raised); border-radius: 16px; padding: 12px 6px; font-size: 22px; font-family: var(--font-display); }
.tc-big .tc-item span { font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--muted); }
.tc-big .tc-item.empty { opacity: .6; }
.award-sheet { padding-top: 30px; }
.award-glow { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px;
  background: radial-gradient(circle, color-mix(in srgb, var(--tier) 45%, transparent), transparent 68%);
  animation: trophy-in .7s cubic-bezier(.3, 1.6, .5, 1); }
.award-glow svg { filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .45)); animation: bob 2.4s ease-in-out .7s infinite; }
@keyframes trophy-in { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-6px) rotate(3deg); } }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

/* Feed + cards */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
.card { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 0; background: var(--ink);
  transition: transform .42s cubic-bezier(.2, .8, .2, 1); }
.card.below { transform: translateY(100%); }
.card.above { transform: translateY(-100%); }
.card-head { display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; flex-shrink: 0; position: relative; }
.card-head .sound-btn { position: absolute; top: -9px; right: -12px; margin: 0; } /* mute, in the card's top-right corner */
.chip { display: inline-flex; color: var(--ink); border-radius: 999px; padding: 5px 14px; font-family: var(--font-display);
  font-weight: 600; font-size: 13px; letter-spacing: 1.5px; }
.kicker { font-size: 15px; color: var(--muted); }
.prompt { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; text-wrap: balance; }
.prompt.long { font-size: 26px; line-height: 1.1; }
.meta { font-size: 12px; color: var(--dim); letter-spacing: 1px; }
.map-wrap { position: relative; flex: 1; min-height: 150px; border-radius: 22px; background: var(--ink); border: 2px solid var(--map-edge); overflow: hidden; }
.map { position: absolute; inset: 0; }
.map svg { display: block; width: 100%; height: 100%; cursor: crosshair; }
.map svg.revealed { cursor: default; }
.m-grid { fill: none; stroke: var(--text); stroke-opacity: .05; stroke-width: .6; vector-effect: non-scaling-stroke; }
