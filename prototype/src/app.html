/* Layout: one phone-sized column. Each screen stacks top bar → content → actions; on a card the map takes the leftover height.
   Single dark look on purpose (it is the brand), so there is no light theme. Tokens come from CLAUDE.md. */
:root {
  --backdrop: #060917;
  --ink: #0B1026; --surface: #151C42; --raised: #1A2350; --outline: #232C60; --outline-2: #2A3570; --map-edge: #1E2A5C;
  --text: #F4F1E8; --muted: #B9BEDA; --dim: #8E95BD; --body-strong: #E2E4F0;
  --gold: #FFB547; --teal: #3DDCC4; --pink: #FF6FA8;
  --font-display: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }
body {
  margin: 0;
  background: var(--backdrop); color: var(--text); font-family: var(--font-body);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.phone { position: relative; width: 100%; height: 100%; max-width: 440px; background: var(--ink); overflow: hidden; overflow: clip; isolation: isolate; }
/* overflow: clip (not just hidden) so the frame can never be scrolled: the starfield below is bigger than the frame on purpose. */
/* A slow, twinkling starfield and a drifting aurora behind every screen. */
.phone::before, .phone::after { content: ""; position: absolute; inset: -20%; pointer-events: none; z-index: -1; }
.phone::before { inset: -260px 0 0 -230px; /* one pattern tile bigger up-left, so the drift loops with no gaps */
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1px 1px at 72% 9%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.4px 1.4px at 38% 62%, rgba(169,198,255,.7), transparent 60%),
    radial-gradient(1px 1px at 86% 44%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.3px 1.3px at 22% 84%, rgba(255,181,71,.6), transparent 60%),
    radial-gradient(1px 1px at 58% 30%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.1px 1.1px at 93% 76%, rgba(61,220,196,.6), transparent 60%),
    radial-gradient(1px 1px at 47% 92%, rgba(255,255,255,.5), transparent 60%);
  background-size: 230px 260px; animation: twinkle 5s ease-in-out infinite alternate, drift 90s linear infinite; }
.phone::after {
  background: radial-gradient(ellipse 50% 30% at 20% 10%, rgba(61,220,196,.10), transparent 70%),
    radial-gradient(ellipse 45% 30% at 85% 25%, rgba(255,111,168,.08), transparent 70%),
    radial-gradient(ellipse 60% 35% at 50% 100%, rgba(46,111,142,.16), transparent 70%);
  animation: aurora 18s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }
@keyframes drift { to { transform: translate3d(230px, 260px, 0); } }
@keyframes aurora { to { transform: translate3d(6%, 4%, 0) scale(1.08); } }
@media (min-width: 600px) and (min-height: 640px) {
  .phone { width: 390px; height: min(844px, calc(100% - 40px)); border-radius: 44px;
    box-shadow: 0 0 0 10px #161B36, 0 0 0 11px #262D55, 0 40px 90px rgba(0, 0, 0, .65); }
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 20px 20px 0; flex-shrink: 0; }
.topbar-left { display: flex; align-items: center; gap: 6px; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .5px; }
.wordmark span { color: var(--gold); }
.wordmark { display: inline-flex; align-items: center; }
.wm-globe { width: .95em; height: .95em; margin-right: .22em; flex-shrink: 0; }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 0; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
.brand .wordmark { line-height: 1.05; }
.tagline { font-size: 10.5px; font-weight: 500; color: var(--muted); letter-spacing: .3px; white-space: nowrap; }

/* Welcome screen */
.screen.intro { background: radial-gradient(ellipse 90% 50% at 50% 0%, rgba(46, 111, 142, .35), transparent 70%); }
.intro-brand > *, .intro-steps li { animation: fade-up .6s cubic-bezier(.2, .8, .2, 1) both; }
.intro-brand > :nth-child(2) { animation-delay: .08s; } .intro-brand > :nth-child(3) { animation-delay: .16s; }
.intro-steps li:nth-child(1) { animation-delay: .3s; } .intro-steps li:nth-child(2) { animation-delay: .42s; } .intro-steps li:nth-child(3) { animation-delay: .54s; }
@keyframes fade-up { from { opacity: 0; transform: translateY(14px); } }
.intro-title { background: linear-gradient(100deg, var(--text) 35%, var(--gold) 50%, var(--text) 65%); background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: fade-up .6s .08s both, title-shine 5s ease-in-out 1.2s infinite; }
@keyframes title-shine { 0%, 60% { background-position: 100% 0; } 100% { background-position: -50% 0; } }
.intro-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 8px 24px 26px; }
.intro-brand { display: flex; flex-direction: column; gap: 8px; }
.wordmark.big { font-size: 26px; }
.intro-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1.02; text-wrap: balance; }
.intro-sub { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.intro-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.intro-steps li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: var(--body-strong); }
.intro-steps b { color: var(--text); }
.step-n { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--raised); color: var(--gold);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.intro-foot { flex-shrink: 0; padding: 12px 24px 24px; background: linear-gradient(to top, rgba(11,16,38,.92) 70%, transparent); margin-top: -20px; position: relative; }
.intro-foot .btn.big { animation: nudge 2.6s ease-in-out 1.5s infinite; }
@keyframes nudge { 0%, 88%, 100% { transform: translateY(0); } 92% { transform: translateY(-4px); } 96% { transform: translateY(1px); } }
@media (max-height: 720px) {
  .intro-title { font-size: 31px; }
  .intro-body { gap: 12px; }
  .intro-sub { font-size: 14px; }
  .intro-steps li { font-size: 13.5px; }
}
.stats { display: flex; gap: 8px; }
.stat { display: flex; align-items: center; gap: 6px; background: var(--raised); border: none; border-radius: 999px; padding: 0 12px; height: 36px;
  font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; transition: background .15s; }
.stat:hover { background: #24306A; }
/* Chips look compact but get a full 44px tap area */
.stat, .brand { position: relative; }
.stat::after, .brand::after { content: ""; position: absolute; inset: -4px -2px; }
.stat:active { transform: scale(.94); }
.stats { align-items: center; }
.sound-btn { margin-left: 0; width: 40px; height: 40px; }
.sound-btn[aria-pressed="false"] { color: var(--dim); }
.stat.bump { animation: bump .45s ease-out; }
@keyframes bump { 40% { transform: scale(1.14); background: #24306A; } }
.icon-btn { width: 44px; height: 44px; margin-left: -10px; border-radius: 22px; border: none; background: transparent;
  color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { color: var(--text); background: var(--raised); }

/* Buttons */
.btn { height: 56px; border-radius: 18px; font-family: var(--font-display); font-weight: 700; font-size: 17px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .1s, filter .15s; }
.btn:active { transform: scale(.98); }
.btn.primary { border: none; background: var(--gold); color: var(--ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.primary:disabled { background: var(--outline-2); color: var(--muted); cursor: not-allowed; }
.btn.ghost { border: 2px solid var(--outline-2); background: transparent; color: var(--text); font-weight: 600; }
.btn.teal { height: 46px; padding: 0 18px; border: none; border-radius: 14px; background: var(--teal); color: var(--ink); font-size: 15px; }
.btn.big { height: 62px; border-radius: 20px; font-size: 18px; width: 100%; flex-shrink: 0; }

/* Pick your feed */
.picker-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 20px; }
.picker-head h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 29px; line-height: 1.06; text-wrap: balance; }
.sports-hero { position: relative; flex-shrink: 0; border: none; border-radius: 22px; padding: 16px 16px 16px 18px; cursor: pointer; overflow: hidden;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; color: var(--ink);
  background: radial-gradient(circle at 85% -20%, rgba(255, 255, 255, .45), transparent 45%), linear-gradient(120deg, #FF6FA8 0%, #FF8F6B 60%, #FFB547 100%);
  box-shadow: 0 10px 30px rgba(255, 111, 168, .28); transition: transform .12s; }
.sports-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .35) 45%, transparent 60%);
  transform: translateX(-100%); animation: shine 4.5s ease-in-out 1s infinite; pointer-events: none; }
@keyframes shine { 0%, 70% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.sports-hero:active { transform: scale(.98); }
.hero-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.hero-kicker { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; opacity: .75; }
.hero-name { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; }
.hero-sub { font-size: 12px; font-weight: 500; opacity: .8; }
.hero-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.hero-trophies { display: flex; gap: 6px; background: rgba(11, 16, 38, .82); border-radius: 999px; padding: 5px 9px; color: var(--text); }
.hero-go { background: var(--ink); color: var(--text); font-family: var(--font-display); font-weight: 700; font-size: 15px; border-radius: 12px; padding: 8px 16px; }
.picker-head p { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { min-height: 92px; border-radius: 20px; border: 2px solid var(--outline); background: var(--surface); cursor: pointer;
  display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 12px 15px 14px; text-align: left; transition: border-color .15s, transform .1s; }
.tile { transition: border-color .15s, transform .12s, box-shadow .2s; }
.tile .dot { transition: transform .2s; }
.tile:hover { border-color: color-mix(in srgb, var(--c, var(--outline-2)) 55%, var(--outline)); transform: translateY(-2px); }
.tile:hover .dot { transform: scale(1.25); }
.tile:active { transform: scale(.97); border-color: var(--c, var(--outline-2)); box-shadow: 0 0 22px color-mix(in srgb, var(--c, transparent) 40%, transparent); }
.tile.wide { grid-column: span 2; height: 84px; }
.tile { animation: tile-in .5s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: calc(var(--i, 0) * 55ms + .1s);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c, var(--surface)) 13%, var(--surface)), var(--surface) 60%); }
@keyframes tile-in { from { opacity: 0; transform: translateY(12px) scale(.92); } }
.tile-emoji { font-size: 22px; line-height: 1; filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--c, #000) 55%, transparent)); transition: transform .25s; }
.tile:hover .tile-emoji { transform: scale(1.2) rotate(-8deg); }
.tile:active .tile-emoji { transform: scale(1.3) rotate(8deg); }
.tile-top { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 24px; }
.dot { width: 14px; height: 14px; border-radius: 7px; flex-shrink: 0; }
.tile-count { font-size: 11px; color: var(--dim); letter-spacing: .4px; }
.tile-text { display: flex; flex-direction: column; gap: 2px; }
.tile-name { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.1; }
.tile-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-text { min-width: 0; width: 100%; }
.daily { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-shrink: 0; }
.daily-label { font-size: 12px; color: var(--muted); letter-spacing: 1.2px; }
.daily-title { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin-top: 2px; }
.reset { align-self: center; background: none; border: none; color: var(--dim); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 10px; min-height: 44px; }

/* Sports tabs */
.region-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px 20px 0; flex-shrink: 0; }
.tab { height: 44px; border-radius: 14px; border: 2px solid var(--outline); background: var(--surface); color: var(--text);
  font-family: var(--font-display); font-weight: 700; font-size: 15px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: var(--ink); }
.sport-tabs { display: flex; gap: 6px; padding: 10px 20px 0; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
.sport-tabs::-webkit-scrollbar { display: none; }
.pill { flex: 1 0 auto; min-width: 52px; height: 44px; padding: 0 9px; border-radius: 999px; border: 2px solid var(--outline); background: var(--surface);
  color: var(--text); font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--ink); }

/* Sports feed: stadium-light glow, hot-streak meter, trophy case */
.screen.sports { background:
  radial-gradient(ellipse 70% 40% at 10% -8%, rgba(255, 111, 168, .26), transparent 70%),
  radial-gradient(ellipse 60% 35% at 95% -6%, rgba(61, 220, 196, .18), transparent 70%); }
.screen.sports .card { background: transparent; padding-bottom: 14px; }
.screen.sports .peek { display: none; } /* the meter takes this space; swipe and "Next card" still work */
.screen.sports .panel { min-height: 108px; }
.screen.sports .prompt.long { font-size: 24px; }
.screen.sports .chip { box-shadow: 0 0 18px rgba(255, 111, 168, .45); }
.meter-row { display: flex; align-items: center; gap: 8px; padding: 10px 20px 0; flex-shrink: 0; }
.meter { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.meter-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.1px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter-label .fire { color: var(--gold); text-shadow: 0 0 10px rgba(255, 181, 71, .7); }
.pips { display: flex; gap: 4px; }
.pip { flex: 1; height: 8px; border-radius: 4px; background: var(--outline); transition: background .25s, box-shadow .25s; }
.pip.mile { height: 12px; margin-top: -2px; }
.pip.mile-bronze { box-shadow: inset 0 0 0 2px #E39A5D; }
.pip.mile-silver { box-shadow: inset 0 0 0 2px #CBD5E8; }
.pip.mile-gold { box-shadow: inset 0 0 0 2px #FFC93C; }
.pip.on.bronze { background: #E39A5D; }
.pip.on.silver { background: #CBD5E8; }
.pip.on.gold { background: #FFC93C; box-shadow: 0 0 10px rgba(255, 201, 60, .7); }
.trophy-case { display: flex; gap: 6px; align-items: center; height: 40px; padding: 0 10px; border-radius: 999px; border: 2px solid var(--outline);
  background: var(--surface); cursor: pointer; flex-shrink: 0; }
.trophy-case:hover { border-color: var(--outline-2); }
.tc-item { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tc-item.empty { opacity: .45; }
.res-verdict.sport { font-size: 26px; letter-spacing: .3px; text-shadow: 0 0 16px rgba(61, 220, 196, .45); }
.venue { color: var(--muted); font-weight: 500; }

/* Daily Sports 10 */
.sd-wrap { padding: 12px 20px 0; flex-shrink: 0; }
.daily-sports { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; border-radius: 16px; cursor: pointer;
  border: 2px solid color-mix(in srgb, #FFC93C 55%, transparent); text-align: left; color: var(--text);
  background: linear-gradient(100deg, rgba(255, 201, 60, .2), rgba(255, 111, 168, .16)); transition: transform .12s, border-color .15s; }
.daily-sports:hover { border-color: #FFC93C; }
.daily-sports:active { transform: scale(.98); }
.sd-icon { width: 34px; height: 34px; border-radius: 50%; background: rgba(11, 16, 38, .6); display: grid; place-items: center; flex-shrink: 0; }
.sd-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sd-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.3px; color: #FFC93C; }
.sd-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sd-go { flex-shrink: 0; background: #FFC93C; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 14px; border-radius: 11px; padding: 8px 14px; }
.dsqs { display: flex; gap: 5px; }
.dsq { flex: 1; height: 12px; border-radius: 4px; background: var(--outline); transition: background .25s, transform .25s; }
.dsq.now { box-shadow: inset 0 0 0 2px var(--gold); }
.dsq.hit { background: var(--teal); }
.dsq.miss { background: #E25C6B; }
.sd-hits { color: var(--teal); }
.sd-score { font-family: var(--font-display); font-weight: 700; line-height: 1; margin-top: 8px; }
.sd-score b { font-size: 84px; color: #FFC93C; text-shadow: 0 0 30px rgba(255, 201, 60, .35); }
.sd-score span { font-size: 34px; color: var(--muted); }
.sd-verdict { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin-top: 4px; }
.sd-grid { display: flex; gap: 6px; justify-content: center; }
.dsq.big { flex: 0 0 26px; height: 26px; border-radius: 7px; animation: sq-in .35s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes sq-in { from { transform: scale(0); } }
.share-card { background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.share-label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; color: var(--muted); }
.share-text { margin: 0; font-family: var(--font-body); font-size: 13px; line-height: 1.5; white-space: pre-wrap; background: var(--raised);
  border-radius: 12px; padding: 10px 12px; color: var(--body-strong); user-select: all; -webkit-user-select: all; }
.share-card .btn.big { height: 54px; }
.btn.primary.done { background: var(--teal); }
.share-note { font-size: 13px; color: var(--teal); text-align: center; min-height: 18px; }
.btn.ghost.big { width: 100%; }
.row-mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; color: var(--ink); }
.row-mark.hit { background: var(--teal); }
.row-mark.miss { background: #E25C6B; }
.sd-list .row-name { display: flex; flex-direction: column; }
.sd-list .row-name small { font-size: 11px; color: var(--dim); }

/* Pop-up sheets */
.sheet-overlay { position: absolute; inset: 0; z-index: 50; background: rgba(6, 9, 23, .72); display: flex; align-items: flex-end;
  animation: fade .2s ease-out; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
@keyframes fade { from { opacity: 0; } }
.sheet { position: relative; z-index: 2; width: 100%; box-sizing: border-box; background: var(--surface); border-radius: 26px 26px 0 0; padding: 26px 22px 26px;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; border-top: 2px solid var(--outline-2);
  animation: slideup .32s cubic-bezier(.2, .9, .3, 1.1); max-height: 92%; overflow-y: auto; }
@keyframes slideup { from { transform: translateY(100%); } }
.sheet .btn.big { margin-top: 10px; }
.sheet-icon { width: 76px; height: 76px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; margin-bottom: 4px; }
.tip-icon { color: var(--gold); display: grid; }
.wm-globe.tip-globe { width: 46px; height: 46px; margin: 0; }
.sheet-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.6px; color: var(--muted); }
.sheet-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.08; text-wrap: balance; }
.sheet-title.award { font-size: 36px; }
.sheet-text { margin: 4px 0 0; font-size: 15px; line-height: 1.5; color: var(--body-strong); max-width: 34ch; }
.sheet-text.small { font-size: 13px; color: var(--muted); }
.sheet-text b { color: var(--text); }
.sheet-status { margin-top: 8px; background: var(--raised); border-radius: 14px; padding: 10px 14px; font-size: 13.5px; font-weight: 600; color: var(--gold); }
.points-table { width: 100%; display: flex; flex-direction: column; background: var(--raised); border-radius: 14px; padding: 4px 0; margin-top: 6px; }
.points-table div { display: flex; justify-content: space-between; padding: 7px 14px; font-size: 14px; }
.points-table div + div { border-top: 1px solid var(--outline); }
.points-table b { color: var(--teal); font-variant-numeric: tabular-nums; }
.tc-big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; margin: 6px 0 2px; }
.tc-big .tc-item { flex-direction: column; gap: 4px; background: var(--raised); border-radius: 16px; padding: 12px 6px; font-size: 22px; font-family: var(--font-display); }
.tc-big .tc-item span { font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--muted); }
.tc-big .tc-item.empty { opacity: .6; }
.award-sheet { padding-top: 30px; }
.award-glow { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px;
  background: radial-gradient(circle, color-mix(in srgb, var(--tier) 45%, transparent), transparent 68%);
  animation: trophy-in .7s cubic-bezier(.3, 1.6, .5, 1); }
.award-glow svg { filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .45)); animation: bob 2.4s ease-in-out .7s infinite; }
@keyframes trophy-in { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-6px) rotate(3deg); } }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

/* Feed + cards */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; overflow: clip; touch-action: none; }
.card { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 0; background: transparent;
  transition: transform .45s cubic-bezier(.2, .9, .25, 1.04), opacity .45s; }
.card.below { transform: translateY(100%) scale(.94); opacity: .4; }
.card.above { transform: translateY(-100%) scale(.94); opacity: 0; }
.card-head { display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; flex-shrink: 0; position: relative; }
.card-head .sound-btn { position: absolute; top: -9px; right: -12px; margin: 0; } /* mute, in the card's top-right corner */
.card-head .sound-btn ~ .prompt.long { padding: 0 30px; } /* long questions leave room for the mute button */
.chip { display: inline-flex; color: var(--ink); border-radius: 999px; padding: 5px 14px; font-family: var(--font-display);
  font-weight: 600; font-size: 13px; letter-spacing: 1.5px; }
.kicker { font-size: 15px; color: var(--muted); }
.prompt { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; text-wrap: balance; }
.prompt.long { font-size: 26px; line-height: 1.1; }
.meta { font-size: 12px; color: var(--dim); letter-spacing: 1px; }
.map-wrap { position: relative; flex: 1; min-height: 150px; border-radius: 22px; background: var(--ink); border: 2px solid var(--map-edge); overflow: hidden; }
.map { position: absolute; inset: 0; }
.map svg { display: block; width: 100%; height: 100%; cursor: crosshair; }
.map svg.revealed { cursor: default; }
.m-grid { fill: none; stroke: var(--text); stroke-opacity: .05; stroke-width: .6; vector-effect: non-scaling-stroke; }
.m-inner { fill: none; stroke: var(--text); stroke-opacity: .18; stroke-width: .6; vector-effect: non-scaling-stroke; }
.m-borders { fill: none; stroke: var(--text); stroke-opacity: .28; stroke-width: .7; vector-effect: non-scaling-stroke; }
.m-tol { fill: var(--teal); fill-opacity: 0; stroke: var(--teal); stroke-opacity: 0; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; transition: fill-opacity .5s .4s, stroke-opacity .5s .4s; }
.revealed .m-tol { fill-opacity: .14; stroke-opacity: .55; }
.m-tol.m-shape { stroke-dasharray: none; stroke-width: 1.5; }
/* Deserts and mountain ranges: the whole area lights up */
.m-tol.m-area { stroke-dasharray: none; stroke-width: 1.5; stroke-linejoin: round; }
.revealed .m-tol.m-area { fill-opacity: .32; stroke-opacity: .9; }
/* Oceans and seas are Natural Earth pieces stitched together: fill only, so the seams between pieces don't show */
.revealed .m-tol.m-area.m-water { fill-opacity: .7; stroke-opacity: 0; } /* bright enough to stand out from the teal land */
.m-lakes { stroke: var(--text); stroke-opacity: .14; stroke-width: .5; vector-effect: non-scaling-stroke; }
/* Rivers: a soft teal band (the bullseye zone) with the river itself drawn on top */
.m-tol.m-river { fill: none; stroke-dasharray: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: var(--zone, 20px); vector-effect: none; }
.revealed .m-tol.m-river { stroke-opacity: .16; }
.m-river-line { fill: none; stroke: var(--teal); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke;
  opacity: 0; filter: drop-shadow(0 0 4px rgba(61, 220, 196, .8)); transition: opacity .5s .3s; }
.revealed .m-river-line { opacity: 1; }
.revealed .m-tol.m-shape { fill: var(--gold); fill-opacity: .55; stroke: var(--gold); stroke-opacity: .95; }
.m-line { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 5 4; }
.m-pin, .m-answer { transform-box: fill-box; transform-origin: center; }
.m-pin.drop { animation: drop .3s cubic-bezier(.3, 1.6, .5, 1); }
.m-answer.drop { animation: pop .45s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes drop { from { transform: translateY(-14px) scale(.6); opacity: .3; } }
@keyframes pop { from { transform: scale(.2); } }
.m-shock { fill: none; stroke: var(--teal); stroke-width: 3; transform-box: fill-box; transform-origin: center; pointer-events: none; animation: shock 1s cubic-bezier(.1, .7, .3, 1) both; }
@keyframes shock { from { transform: scale(.5); opacity: 1; stroke-width: 5; } to { transform: scale(7); opacity: 0; stroke-width: .5; } }
.m-pin circle:first-child { filter: drop-shadow(0 3px 3px rgba(0,0,0,.5)); }
.m-ripple { fill: none; stroke: var(--gold); stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: ripple .6s ease-out forwards; pointer-events: none; }
@keyframes ripple { from { transform: scale(.4); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
.btn.primary.ready { animation: ready .5s cubic-bezier(.3, 1.8, .5, 1); }
.btn.lock { position: relative; overflow: hidden; }
.btn.lock:not(:disabled)::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 48%, transparent 62%); transform: translateX(-120%); animation: lock-shine 2.4s ease-in-out .3s infinite; }
@keyframes lock-shine { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.card.revealed .btn.lock::after { animation-duration: 3.6s; }
@keyframes ready { 40% { transform: scale(1.05); } }
/* Floating points, bullseye flash and shake, combo badge */
.float-pts { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 4; font-family: var(--font-display); font-weight: 700; font-size: 30px;
  color: var(--gold); text-shadow: 0 0 18px rgba(255, 181, 71, .7), 0 2px 0 rgba(11, 16, 38, .9); animation: float-up 1.35s cubic-bezier(.2, .8, .3, 1) forwards; }
.float-pts.v-bullseye { color: var(--teal); font-size: 38px; text-shadow: 0 0 22px rgba(61, 220, 196, .85), 0 2px 0 rgba(11, 16, 38, .9); }
.float-pts.v-chilly, .float-pts.v-cold { color: #A9C6FF; font-size: 24px; text-shadow: 0 2px 0 rgba(11, 16, 38, .9); }
@keyframes float-up { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); }
  30% { transform: translate(-50%, -80%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(.95); } }
.flash { position: absolute; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(circle, rgba(255,255,255,.7), rgba(61,220,196,.35) 40%, transparent 75%); animation: flash .65s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.map-wrap.shake { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 15%, 55% { transform: translate(-5px, 2px) rotate(-.6deg); } 35%, 75% { transform: translate(5px, -2px) rotate(.6deg); } 90% { transform: translate(-2px, 0); } }
.combo-badge { position: absolute; left: 10px; top: 10px; z-index: 4; display: flex; align-items: center; gap: 5px; padding: 6px 12px 6px 9px; border-radius: 999px;
  background: linear-gradient(100deg, #FF6FA8, #FF8F6B 55%, #FFB547); color: var(--ink); font-family: var(--font-display); box-shadow: 0 6px 22px rgba(255, 111, 168, .5);
  animation: combo-in .55s cubic-bezier(.3, 1.8, .5, 1) both; pointer-events: none; }
.combo-badge b { font-size: 20px; line-height: 1; }
.combo-badge span:last-child { font-size: 11px; font-weight: 700; letter-spacing: 1.3px; }
.combo-fire { font-size: 18px; animation: flicker .5s ease-in-out infinite alternate; display: inline-block; }
.combo-badge.mega { background: linear-gradient(100deg, #3DDCC4, #A9C6FF 50%, #FF6FA8); box-shadow: 0 0 30px rgba(61, 220, 196, .65); }
@keyframes combo-in { from { opacity: 0; transform: scale(.3) rotate(-14deg); } }
@keyframes flicker { to { transform: scale(1.18) rotate(6deg); } }
.res-pts.pop { animation: pts-pop .35s cubic-bezier(.3, 1.8, .5, 1); display: inline-block; }
@keyframes pts-pop { 50% { transform: scale(1.25); } }
/* Verdict colors by how close the guess was */
.res-verdict.v-scorching { color: #FF7A59; text-shadow: 0 0 14px rgba(255, 122, 89, .45); }
.res-verdict.v-hot { color: #FF9B6B; }
.res-verdict.v-warm { color: var(--gold); }
.res-verdict.v-chilly { color: #A9C6FF; }
.res-verdict.v-cold { color: #8FB8FF; }
.res-verdict.v-bullseye { text-shadow: 0 0 18px rgba(61, 220, 196, .6); }
/* Toast: drops in from the top for a goal or a new rank */
.toast { position: absolute; left: 16px; right: 16px; top: 74px; z-index: 40; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 20px;
  background: linear-gradient(110deg, #1F2A66, #2A2363); border: 2px solid var(--gold); box-shadow: 0 14px 40px rgba(0, 0, 0, .5), 0 0 30px rgba(255, 181, 71, .3);
  animation: toast-in .5s cubic-bezier(.3, 1.5, .5, 1) both; pointer-events: none; }
.toast.rank { border-color: var(--teal); box-shadow: 0 14px 40px rgba(0, 0, 0, .5), 0 0 30px rgba(61, 220, 196, .35); }
.toast.out { animation: toast-out .45s ease-in forwards; }
.toast-icon { font-size: 30px; animation: bob 1.6s ease-in-out infinite; }
.toast-text { display: flex; flex-direction: column; gap: 1px; }
.toast-text b { font-family: var(--font-display); font-size: 19px; }
.toast-text span { font-size: 13px; color: var(--muted); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-40px) scale(.9); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-30px) scale(.95); } }
/* Home screen: explorer rank + today's goal */
.progress-card { width: 100%; text-align: left; color: var(--text); font: inherit; cursor: pointer; transition: transform .12s, border-color .15s; flex-shrink: 0; background: linear-gradient(135deg, rgba(61, 220, 196, .10), rgba(255, 181, 71, .08)), var(--surface); border: 2px solid var(--outline);
  border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; animation: tile-in .5s cubic-bezier(.3, 1.5, .5, 1) both; }
.pc-row { display: flex; align-items: center; gap: 10px; }
.progress-card:hover { border-color: var(--outline-2); }
.progress-card:active { transform: scale(.98); }
.pc-badge.big { width: 64px; height: 64px; font-size: 34px; background: none; }
.rank-sheet { max-height: 90%; }
.rank-list { list-style: none; margin: 6px 0 0; padding: 4px 0; width: 100%; background: var(--raised); border-radius: 14px; text-align: left; }
.rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 14px; }
.rank-row + .rank-row { border-top: 1px solid var(--outline); }
.rank-mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; background: var(--outline); color: var(--muted); }
.rank-name { flex: 1; min-width: 0; }
.rank-pts { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.rank-row.done .rank-mark { background: var(--teal); color: var(--ink); }
.rank-row.done .rank-name { color: var(--muted); }
.rank-row.now { background: rgba(255, 181, 71, .12); }
.rank-row.now .rank-mark { background: var(--gold); color: var(--ink); }
.rank-row.now .rank-name { color: var(--gold); font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.rank-row.now .rank-pts { color: var(--gold); font-weight: 600; }
.rank-row.next .rank-mark { background: rgba(61, 220, 196, .2); color: var(--teal); }
.rank-row.next .rank-pts { color: var(--teal); font-weight: 600; }
.rank-row.locked { opacity: .7; }
.rank-row.locked .rank-mark { background: none; font-size: 13px; }
.pc-badge { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; background: rgba(255, 181, 71, .16); flex-shrink: 0; }
.pc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pc-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; color: var(--muted); }
.pc-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; color: var(--gold); }
.pc-next { font-size: 11px; color: var(--dim); text-align: right; line-height: 1.3; flex-shrink: 0; }
.pc-bar { display: block; height: 8px; border-radius: 4px; background: var(--outline); overflow: hidden; }
.pc-bar i { display: block; height: 100%; width: var(--w); border-radius: 4px; background: linear-gradient(90deg, var(--teal), var(--gold));
  box-shadow: 0 0 12px rgba(255, 181, 71, .5); animation: bar-grow 1.1s cubic-bezier(.2, .8, .2, 1) .3s both; }
@keyframes bar-grow { from { width: 0; } }
.panel.revealed .res-verdict { display: inline-block; animation: verdict .5s cubic-bezier(.3, 1.8, .5, 1) .1s both; }
@keyframes verdict { from { transform: scale(.5) rotate(-6deg); opacity: 0; } }
.card .confetti { z-index: 5; }
.zoom-btns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 8px; }
.zoom-btns button { width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(26, 35, 80, .9); color: var(--text);
  font-size: 22px; line-height: 1; cursor: pointer; }
.zoom-btns button:hover { background: var(--outline-2); }
.zoom-btns .zoom-reset { display: none; place-items: center; font-size: 0; }
.map-wrap.zoomed .zoom-reset { display: grid; animation: pop .3s cubic-bezier(.3, 1.8, .5, 1); }
/* On a short map (small phones, after lock-in) the buttons sit in a row so they don't cover the map */
.map-wrap { container-type: size; }
@container (max-height: 170px) { .zoom-btns { flex-direction: row; top: 8px; right: 8px; gap: 6px; } }

.panel { min-height: 128px; box-sizing: border-box; background: var(--surface); border-radius: 16px; padding: 13px 16px;
  display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.panel-label { font-size: 12px; color: var(--muted); letter-spacing: 1.2px; }
.panel-body { font-size: 14px; line-height: 1.45; color: var(--body-strong); }
.panel.revealed { animation: rise .35s ease-out; }
/* After lock-in the whole "Now you know" fact must show. The map shrinks to make room;
   on a very short screen the panel scrolls instead of cutting text off. */
.card.revealed .map-wrap { min-height: 90px; }
.card.revealed .panel { flex-shrink: 1; min-height: 0; overflow-y: auto; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.res-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.res-verdict { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--gold); }
.res-verdict.bull { color: var(--teal); }
.res-pts { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--teal); font-variant-numeric: tabular-nums; }
.res-miles { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.res-answer { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-top: 2px; }
.answer-dot { width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid var(--teal); flex-shrink: 0; }
.res-fact { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.42; color: var(--body-strong); }
.res-fact svg { flex-shrink: 0; margin-top: 1px; }
.res-fact b { color: var(--text); font-weight: 600; }
.res-pin { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.4; color: var(--muted); }
.res-pin b { color: var(--text); font-weight: 600; }
.pin-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); flex-shrink: 0; margin: 4px 4px 0; box-shadow: 0 0 0 3px rgba(255, 181, 71, .25); }
.res-right { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
/* 🤓 Nerd facts button: a bright teal-to-lavender pill that pops in, shines and glows so players notice it.
   Once opened (.seen) it settles down. All motion is off under prefers-reduced-motion. */
.nerd-btn { display: inline-flex; align-items: center; gap: 4px; padding: 3px 5px 3px 8px; min-height: 26px; border-radius: 999px; border: none;
  background: linear-gradient(100deg, #3DDCC4 0%, #A9C6FF 45%, #D7A8FF 60%, #3DDCC4 100%); background-size: 220% 100%;
  color: var(--ink); font: 700 12px/1 var(--font-display); letter-spacing: .2px; cursor: pointer; vertical-align: middle; position: relative;
  white-space: nowrap; flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(61, 220, 196, .35), 0 0 16px rgba(61, 220, 196, .55); }
.nerd-btn::after { content: ''; position: absolute; inset: -9px -4px; } /* 44px touch target */
.nerd-btn .nerd-face { font-size: 14px; display: inline-block; transform-origin: 50% 80%; }
.nerd-btn .nerd-count { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 999px;
  background: var(--ink); color: var(--gold); font: 700 10px/1 var(--font-display); }
.panel.revealed .nerd-btn { animation: nerd-pop .6s cubic-bezier(.3, 1.8, .5, 1) .45s both, nerd-sheen 2.8s linear 1.1s infinite, nerd-glow 1.4s ease-in-out 1.1s infinite alternate; }
.panel.revealed .nerd-btn .nerd-face { animation: nerd-wiggle 3.2s ease-in-out 1.3s infinite; }
.nerd-btn.seen, .panel.revealed .nerd-btn.seen { animation: none; box-shadow: 0 0 0 2px rgba(61, 220, 196, .3); }
.nerd-btn.seen .nerd-face { animation: none !important; }
@keyframes nerd-pop { from { transform: scale(.2) rotate(-12deg); opacity: 0; } }
@keyframes nerd-sheen { to { background-position: -220% 0; } }
@keyframes nerd-glow { to { box-shadow: 0 0 0 3px rgba(169, 198, 255, .5), 0 0 26px 4px rgba(61, 220, 196, .75); } }
@keyframes nerd-wiggle { 0%, 72%, 100% { transform: none; } 78% { transform: rotate(-16deg) scale(1.25); } 86% { transform: rotate(14deg) scale(1.25); } 93% { transform: rotate(-5deg); } }
.nerd-emoji { font-size: 38px; line-height: 1; }
.nerd-sheet { max-height: 88%; overflow-y: auto; }
.nerd-list { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
.nerd-row { background: var(--raised); border-radius: 14px; padding: 10px 14px; text-align: left; }
.nerd-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--teal); }
.nerd-text { font-size: 14.5px; line-height: 1.45; color: var(--body-strong); margin-top: 2px; }

.actions { display: flex; gap: 12px; flex-shrink: 0; }
.actions .ghost { flex: 1; }
.actions .primary { flex: 2; }
.peek { flex-shrink: 0; height: 50px; margin: 0 -4px; border: none; border-radius: 18px 18px 0 0; background: var(--surface);
  display: flex; align-items: center; gap: 10px; padding: 0 16px; cursor: pointer; min-width: 0; }
.peek-label { font-size: 11px; color: var(--dim); letter-spacing: 1.2px; flex-shrink: 0; }
.peek-next { font-family: var(--font-display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-height: 760px) {
  .peek { display: none; }
  .card { padding-bottom: 14px; }
  .prompt { font-size: 29px; }
  .prompt.long { font-size: 23px; }
}

/* Daily 10 results */
.results-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 22px 20px 24px; }
.results-head { text-align: center; }
.results-total { font-family: var(--font-display); font-weight: 700; font-size: 60px; line-height: 1.05; color: var(--gold); margin-top: 6px; font-variant-numeric: tabular-nums; }
.results-sub { color: var(--muted); font-size: 14px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat-grid div { background: var(--surface); border-radius: 16px; padding: 12px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.stat-grid b { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat-grid span { font-size: 12px; color: var(--muted); }
.result-list { list-style: none; margin: 0; padding: 4px 0; background: var(--surface); border-radius: 16px; }
.result-list li { display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 14px; }
.result-list li + li { border-top: 1px solid var(--outline); }
.result-list .dot { width: 10px; height: 10px; }
.row-n { width: 18px; color: var(--dim); font-variant-numeric: tabular-nums; }
.row-name { flex: 1; min-width: 0; line-height: 1.25; overflow-wrap: anywhere; } /* long names wrap instead of being cut off */
.row-miles { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.row-pts { width: 50px; text-align: right; color: var(--teal); font-weight: 600; font-variant-numeric: tabular-nums; }
.results-note { margin: 0; text-align: center; font-size: 13px; color: var(--dim); }

/* Smaller phones (iPhone SE and similar): tighten everything so nothing falls off the screen */
@media (max-height: 760px) {
  .topbar { padding-top: 12px; }
  .picker-body { gap: 10px; padding-top: 12px; }
  .picker-head h1 { font-size: 25px; }
  .picker-head p { font-size: 14px; margin-top: 4px; }
  .sports-hero { padding: 12px 14px 12px 16px; }
  .hero-name { font-size: 26px; }
  .btn.big { height: 54px; }
  .tile { min-height: 74px; padding: 10px 13px 12px; gap: 6px; }
  .tile-name { font-size: 17px; }
  .tile-sub { display: none; }
  .progress-card { padding: 9px 12px; gap: 6px; }
  .pc-badge { width: 30px; height: 30px; font-size: 16px; }
  .pc-name { font-size: 17px; }

  .daily { padding: 10px 14px; }
  .card { gap: 9px; padding-top: 10px; }
  .card-head { gap: 5px; }
  .kicker { font-size: 13px; }
  .map-wrap { min-height: 120px; }
  .res-pin, .res-fact { font-size: 12.5px; }
  /* Sports screens have tabs and a streak meter, so after lock-in make room for the Next button. */
  .panel, .screen.sports .panel { min-height: 92px; padding: 11px 14px; }
  .btn { height: 50px; }
  .region-tabs { padding-top: 10px; }
  .sport-tabs { padding-top: 8px; }
  .meter-row { padding-top: 8px; }
  .screen.sports .prompt.long { font-size: 21px; }
  .screen.sports .chip { padding: 4px 12px; font-size: 12px; }
  .sd-wrap { padding-top: 8px; }
  .daily-sports { min-height: 46px; padding: 4px 6px 4px 10px; }
  .sd-icon { width: 30px; height: 30px; }
  .sd-score b { font-size: 64px; }
}

/* Every phone height: after lock-in, make room so the whole "Now you know" fact shows. */
@media (max-height: 900px) {
  .screen.sports:has(.card.revealed:not(.above)) :is(.sd-wrap, .sport-tabs) { display: none; } /* Daily Sports banner and sport row step aside while a result shows; back on the next card */
  .card.revealed .map-wrap { min-height: 70px; }
  .card.revealed .chip { display: none; } /* the category is already known once you've guessed; frees a line for the fact */
}
/* Short phones: Sports has five rows above the card, so before the guess the hint box steps aside
   (the button already says "Drop a pin first") and the Lock in button stays on screen. */
@media (max-height: 640px) {
  .screen.sports .card:not(.revealed) .panel { display: none; }
  .screen.sports .map-wrap { min-height: 96px; } /* the map can shrink a little more so Skip / Lock in keep their bottom spacing */
}
/* Shortest phones (iPhone SE in Safari): the remaining tab rows also step aside while a result shows. */
@media (max-height: 620px) {
  .screen:has(.card.revealed:not(.above)) :is(.region-tabs, .geo-tabs, .meter-row) { display: none; }

}

/* ===================== THE JUICE (effects from fx.js) =====================
   Loud, bouncy and bright, but never strobing: at most one flash at a time.
   Everything here switches off under prefers-reduced-motion (see the block at the end). */

/* Welcome screen: spinning globe, floating emoji, bouncing letters, rainbow title */
.intro-globe { height: 220px; margin-top: 12px; flex-shrink: 0; display: grid; place-items: center; }
.fx-globe { display: block; }
@media (max-height: 720px) { .intro-globe { height: 150px; margin-top: 6px; } } /* small phones: a smaller globe leaves room for the steps */
.screen.intro > * { position: relative; z-index: 1; }
.wave-letter { display: inline-block; font-style: normal; animation: wave 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * 90ms); }
@keyframes wave { 0%, 55%, 100% { transform: none; } 18% { transform: translateY(-11px) rotate(-8deg) scale(1.2); } 34% { transform: translateY(3px) scale(.95); } }
.intro-title { background-image: linear-gradient(100deg, var(--text) 28%, var(--gold) 38%, var(--pink) 48%, var(--teal) 58%, var(--text) 68%);
  animation: fade-up .6s .08s both, title-shine 2.6s ease-in-out .8s infinite; }
.intro-steps .step-n { animation: spin-in .8s cubic-bezier(.3, 1.6, .5, 1) both, step-glow 1.6s ease-in-out 1.2s infinite alternate; }
.intro-steps li:nth-child(1) .step-n { animation-delay: .35s, 1.2s; }
.intro-steps li:nth-child(2) .step-n { animation-delay: .5s, 1.5s; }
.intro-steps li:nth-child(3) .step-n { animation-delay: .65s, 1.8s; }
@keyframes spin-in { from { transform: rotate(-720deg) scale(0); } }
@keyframes step-glow { to { box-shadow: 0 0 0 3px rgba(255, 181, 71, .35), 0 0 18px rgba(255, 181, 71, .7); color: #FFE2A8; } }
.intro-foot .btn.big { position: relative; overflow: hidden; background: linear-gradient(90deg, #FFB547, #FFD36B, #FFB547); background-size: 200% 100%;
  animation: nudge 2.2s ease-in-out 1s infinite, btn-glow 1.1s ease-in-out infinite alternate, btn-sheen 2.4s linear infinite; }
@keyframes btn-glow { from { box-shadow: 0 0 0 0 rgba(255, 181, 71, .0); } to { box-shadow: 0 0 0 5px rgba(255, 181, 71, .25), 0 0 34px 6px rgba(255, 181, 71, .55); } }
@keyframes btn-sheen { to { background-position: -200% 0; } }

/* Everywhere: the little globe in the logo never stops spinning */
.wm-globe { animation: globe-spin 3.5s linear infinite; }
@keyframes globe-spin { to { transform: rotate(360deg); } }

/* Home screen: wiggling tiles, bobbing emoji, glowing Sports banner, heartbeat Play button, spinning rank star */
.tile { animation: tile-in .5s cubic-bezier(.3, 1.5, .5, 1) both, tile-wiggle 6s ease-in-out infinite;
  animation-delay: calc(var(--i, 0) * 55ms + .1s), calc(var(--i, 0) * .75s + 2s); }
@keyframes tile-wiggle { 0%, 88%, 100% { transform: none; } 90% { transform: rotate(-3deg) scale(1.05); } 93% { transform: rotate(3deg) scale(1.05); } 96% { transform: rotate(-1.5deg); } }
.tile-emoji { display: inline-block; animation: emoji-bob 2.2s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .25s); }
@keyframes emoji-bob { 50% { transform: translateY(-4px) rotate(10deg) scale(1.15); } }
.tile.fx-boing .tile-emoji { animation: emoji-spin .5s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes emoji-spin { from { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(1.8); } to { transform: rotate(360deg) scale(1); } }
.sports-hero { animation: hero-glow 1.6s ease-in-out infinite alternate; }
@keyframes hero-glow { to { box-shadow: 0 10px 42px rgba(255, 111, 168, .65), 0 0 0 3px rgba(255, 255, 255, .28); filter: saturate(1.3) brightness(1.06); } }
#go-daily { animation: heartbeat 1.3s ease-in-out infinite; }
@keyframes heartbeat { 0%, 40%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 28% { transform: scale(1.04); } }
.pc-badge { display: inline-grid; animation: star-spin 3s cubic-bezier(.5, 0, .5, 1) infinite; }
@keyframes star-spin { 0%, 60% { transform: rotate(0) scale(1); } 80% { transform: rotate(200deg) scale(1.3); } 100% { transform: rotate(360deg) scale(1); } }
.picker-head h1 { background: linear-gradient(100deg, var(--text) 30%, var(--gold) 42%, var(--pink) 52%, var(--text) 64%); background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: title-shine 3s ease-in-out .5s infinite; }

/* Home screen fly-in (2 seconds) */
.fx-flyin { position: absolute; inset: 0; z-index: 60; overflow: hidden; cursor: pointer;
  background:
    radial-gradient(1.2px 1.2px at 12% 18%, rgba(255,255,255,.7), transparent 60%), radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.3px 1.3px at 88% 64%, rgba(169,198,255,.6), transparent 60%), radial-gradient(1px 1px at 22% 78%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.1px 1.1px at 58% 92%, rgba(255,211,107,.5), transparent 60%), radial-gradient(1px 1px at 6% 52%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(ellipse at 50% 42%, #1A2766, #0B1026 70%); }
.fx-flyin canvas { display: block; }
.fx-flyin.out { animation: flyin-out .42s cubic-bezier(.4, 0, .2, 1) forwards; pointer-events: none; }
@keyframes flyin-out { to { transform: scale(1.08); opacity: 0; filter: blur(6px); } } /* a clean fade and push-in, no tilt */
.fx-flash { position: absolute; inset: 0; background: #FFF; opacity: 0; pointer-events: none; }
.fx-flyin.slam .fx-flash { animation: one-flash .4s ease-out; } /* a single flash, never a strobe */
@keyframes one-flash { from { opacity: .55; } to { opacity: 0; } }
.fx-ring { position: absolute; left: 50%; top: 42%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 5px solid var(--gold); opacity: 0; }
.fx-ring.r2 { border-color: var(--teal); }
.fx-flyin.slam .fx-ring { animation: ring-out .8s ease-out forwards; }
.fx-flyin.slam .fx-ring.r2 { animation-delay: .12s; }
@keyframes ring-out { from { opacity: 1; transform: scale(.5); } to { opacity: 0; transform: scale(15); border-width: 1px; } }
/* The hero wordmark: World (pearl) + Scroll (polished gold), letters landing one by one, then one glint of light */
.fx-flyin { container-type: inline-size; }
.fx-logo { position: absolute; left: 0; right: 0; top: 66%; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
.fx-logo::before { content: ''; position: absolute; left: 50%; top: 42%; width: 120%; height: 160%; translate: -50% -50%; opacity: 0;
  background: radial-gradient(ellipse 45% 40% at 50% 50%, rgba(255, 181, 71, .32), rgba(255, 181, 71, 0) 70%); }
.fx-flyin.slam .fx-logo::before { animation: aura-in 1s ease-out .2s forwards; }
@keyframes aura-in { to { opacity: 1; } }
.fx-wm { position: relative; display: flex; font-family: var(--font-display); font-weight: 700; font-size: min(14.5cqw, 62px); line-height: 1; letter-spacing: -.5px;
  filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .55)); }
.fx-wm i { display: inline-block; font-style: normal; opacity: 0; transform: translateY(.45em) scale(.7); filter: blur(10px);
  background-image: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .95) 50%, transparent 62%),
    linear-gradient(180deg, #FFFFFF 0%, #F6F3EA 48%, #C8D2F0 100%);
  background-size: 260% 100%, 100% 100%; background-position: 160% 0, 0 0; background-repeat: no-repeat;
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.fx-wm .s i { background-image: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .95) 50%, transparent 62%),
    linear-gradient(180deg, #FFF7DA 0%, #FFD877 34%, #FFB547 60%, #DB850F 100%); }
.fx-flyin.slam .fx-wm i { animation: letter-in .55s cubic-bezier(.2, 1.25, .35, 1) forwards, glint .9s ease-in-out 1.05s forwards;
  animation-delay: calc(var(--i) * 34ms), calc(1.05s + var(--i) * 24ms); }
@keyframes letter-in { to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes glint { to { background-position: -60% 0, 0 0; } }
.fx-tag { display: flex; align-items: center; gap: 10px; font: 600 11px/1 var(--font-body); letter-spacing: 5px; color: rgba(214, 220, 245, .88); opacity: 0;
  white-space: nowrap; }
.fx-tag::before, .fx-tag::after { content: ''; width: 18px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 211, 107, .9)); }
.fx-tag::after { background: linear-gradient(90deg, rgba(255, 211, 107, .9), transparent); }
.fx-flyin.slam .fx-tag { animation: tag-in .8s ease-out .5s forwards; }
@keyframes tag-in { from { opacity: 0; letter-spacing: 4.5px; } to { opacity: 1; letter-spacing: 2.4px; } }
/* ...then the home screen blasts in, piece by piece */
.screen.picker.arrived .picker-body > * { animation: blast-in .6s cubic-bezier(.3, 1.7, .5, 1) both; }
.screen.picker.arrived .picker-body > :nth-child(2) { animation-delay: .06s; }
.screen.picker.arrived .picker-body > :nth-child(3) { animation-delay: .12s; }
.screen.picker.arrived .picker-body > :nth-child(4) { animation-delay: .18s; }
.screen.picker.arrived .picker-body > :nth-child(5) { animation-delay: .24s; }
.screen.picker.arrived .picker-body > :nth-child(n+6) { animation-delay: .3s; }
.screen.picker.arrived .topbar { animation: blast-in .6s cubic-bezier(.3, 1.7, .5, 1) both; }
@keyframes blast-in { from { opacity: 0; transform: scale(.3) rotate(-8deg) translateY(40px); } }

/* Tap juice: squash-and-stretch on every button, confetti + emoji bursts, a ring where you tapped */
.fx-boing { animation: boing .45s cubic-bezier(.3, 1.6, .5, 1) !important; }
@keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(1.12, .86); } 55% { transform: scale(.92, 1.1); } 75% { transform: scale(1.04, .97); } 100% { transform: scale(1); } }
.fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
.fx-bit { position: absolute; width: 8px; height: 8px; border-radius: 2px; transform: translate(-50%, -50%); animation: bit-fly .75s cubic-bezier(.15, .7, .3, 1) forwards; }
.fx-bit.emoji { width: auto; height: auto; font-size: 18px; font-style: normal; line-height: 1; }
@keyframes bit-fly { to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(.5); opacity: 0; } }
.fx-tapring { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid var(--gold); animation: tapring .55s ease-out forwards; }
@keyframes tapring { to { transform: scale(5); opacity: 0; border-width: 1px; } }

/* "LET'S GO!" slam pop-up when a feed starts */
.fx-slam { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  pointer-events: none; background: radial-gradient(circle at 50% 45%, rgba(11, 16, 38, .7), transparent 65%); animation: slam-out 1.1s forwards; }
.fx-slam-emoji { font-size: 86px; line-height: 1; animation: slam-emoji .65s cubic-bezier(.2, 1.7, .4, 1) both; }
.fx-slam-text { font-family: var(--font-display); font-weight: 700; font-size: 50px; color: var(--gold); letter-spacing: 1px; -webkit-text-stroke: 2px var(--ink);
  text-shadow: 0 5px 0 #9A5A00, 0 0 36px rgba(255, 181, 71, .85); animation: slam-text .5s .08s cubic-bezier(.2, 1.7, .4, 1) both; }
@keyframes slam-emoji { from { transform: scale(0) rotate(-360deg); } }
@keyframes slam-text { from { opacity: 0; transform: scale(4) rotate(-16deg); } }
@keyframes slam-out { 0%, 72% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }

/* Gameplay: each new card pops in */
.card-head .chip { animation: chip-in .5s cubic-bezier(.3, 1.7, .5, 1) both; }
@keyframes chip-in { from { transform: scale(0) rotate(-20deg); } }
.card-head .prompt { animation: prompt-pop .6s .08s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes prompt-pop { from { opacity: 0; transform: scale(.4) translateY(14px); } }
.m-plane { font-size: 20px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .6)); pointer-events: none; }
.fx-bit.small { width: 5px; height: 5px; border-radius: 50%; }

/* Result reactions (fx.js reveal): bullseye party, a wall of fire for hot guesses, snow for cold ones */
.fx-reveal { position: absolute; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
.fx-word { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: 46px; letter-spacing: 1px; -webkit-text-stroke: 2px var(--ink);
  animation: word-slam 1.6s cubic-bezier(.2, 1.6, .4, 1) forwards; }
.fx-word span { font-size: 40px; -webkit-text-stroke: 0; animation: word-emoji .35s ease-in-out infinite alternate; }
.fx-word span + b + span { animation-delay: .17s; }
@keyframes word-emoji { to { transform: scale(1.25) rotate(12deg); } }
@keyframes word-slam { 0% { opacity: 0; transform: scale(3.5) rotate(-12deg); } 18% { opacity: 1; transform: scale(1) rotate(-3deg); }
  75% { opacity: 1; transform: scale(1.06) rotate(-3deg); } 100% { opacity: 0; transform: scale(.8) translateY(-30px); } }
.v-bullseye .fx-word { color: var(--gold); text-shadow: 0 5px 0 #9A5A00, 0 0 40px rgba(255, 181, 71, .9); font-size: 52px; }
.v-scorching .fx-word, .v-hot .fx-word { color: #FF8A2B; text-shadow: 0 5px 0 #8A2A00, 0 0 34px rgba(255, 90, 20, .95); }
.v-warm .fx-word { color: #FFD36B; text-shadow: 0 4px 0 #8A6000, 0 0 26px rgba(255, 211, 107, .8); font-size: 40px; }
.v-chilly .fx-word, .v-cold .fx-word { color: #BDEBFF; text-shadow: 0 4px 0 #1D4E7A, 0 0 30px rgba(124, 196, 255, .9); font-size: 40px; }
/* bullseye: golden sunburst spinning out of the answer, and a rain of stars */
.fx-rays { position: absolute; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255, 181, 71, .55) 0 9deg, transparent 9deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 8%, transparent 62%); mask: radial-gradient(circle, #000 8%, transparent 62%);
  animation: rays 2.1s ease-out forwards; }
@keyframes rays { 0% { opacity: 0; transform: scale(.15) rotate(0); } 18% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1) rotate(140deg); } }
.fx-rain { position: absolute; top: -50px; animation: rain-fall 1.7s cubic-bezier(.4, 0, .8, .6) forwards; }
@keyframes rain-fall { to { transform: translateY(950px) rotate(600deg); } }
.screen.fx-quake { animation: quake .6s; }
@keyframes quake { 10%, 50%, 90% { translate: -8px 3px; rotate: -.7deg; } 30%, 70% { translate: 8px -3px; rotate: .7deg; } }
/* scorching / hot: flames burn up the screen from the bottom */
.fx-heat { position: absolute; left: 0; right: 0; bottom: 0; height: 65%; animation: heat 2.1s ease-out forwards;
  background: linear-gradient(to top, rgba(255, 80, 10, .6), rgba(255, 160, 40, .28) 45%, transparent); }
.v-hot .fx-heat { height: 38%; }
@keyframes heat { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: .85; } 100% { opacity: 0; } }
.fx-flame { position: absolute; bottom: -70px; transform-origin: 50% 100%; filter: drop-shadow(0 0 14px rgba(255, 110, 0, .95));
  animation: flame-rise 2s ease-out forwards, flame-flicker .16s ease-in-out infinite alternate; }
@keyframes flame-rise { 0% { transform: translateY(0) scale(.5); opacity: 0; } 10% { opacity: 1; }
  45% { transform: translateY(calc(var(--reach) * -560px)) scale(1.35); }
  65% { transform: translateY(calc(var(--reach) * -600px)) scale(1.15) rotate(-7deg); }
  100% { transform: translateY(calc(var(--reach) * -900px)) scale(.5); opacity: 0; } }
@keyframes flame-flicker { to { scale: 1.18 .88; } }
/* warm: a sun pops out of the answer */
.fx-sun { position: absolute; font-size: 72px; transform: translate(-50%, -50%); filter: drop-shadow(0 0 22px rgba(255, 211, 107, .95));
  animation: sun-pop 1.7s cubic-bezier(.2, 1.6, .4, 1) forwards; }
@keyframes sun-pop { 0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); } 30% { transform: translate(-50%, -50%) scale(1.25) rotate(0); }
  80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.6) rotate(90deg); } }
/* chilly / cold: snow drifts down; cold also frosts the edges and shivers */
.fx-snow { position: absolute; top: -40px; animation: snow-fall 2.1s linear forwards; }
@keyframes snow-fall { to { transform: translate(var(--sway), 640px) rotate(360deg); opacity: 0; } }
.fx-frost { position: absolute; inset: 0; box-shadow: inset 0 0 70px 24px rgba(189, 235, 255, .6); animation: heat 2.1s ease-out forwards; }
.screen.fx-shiver { animation: shiver .6s; }
@keyframes shiver { 20%, 60% { translate: -4px 0; } 40%, 80% { translate: 4px 0; } }

/* Deep Dives: rare bonus cards (gold frame, RARE FIND banner, unlock pop, gold button and pop-up) */
.chip-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.deep-chip { background: linear-gradient(90deg, #FFD36B, #FFB547, #FFE7A3, #FFB547); background-size: 200% 100%; color: var(--ink);
  box-shadow: 0 0 14px rgba(255, 181, 71, .7); animation: chip-in .5s cubic-bezier(.3, 1.7, .5, 1) both, gold-sheen 1.6s linear infinite !important; }
@keyframes gold-sheen { to { background-position: -200% 0; } }
.card.deep .map-wrap { border-color: var(--gold); animation: deep-glow 1.4s ease-in-out infinite alternate; }
